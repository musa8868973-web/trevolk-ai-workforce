[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "echo '[DIAG] Starting...' && npx prisma db push --accept-data-loss && echo '[DIAG] Migrations done' && node dist/bootstrap.js"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
