[build]
builder = "RAILPACK"
buildCommand = "npm run build"

[deploy]
startCommand = "echo '[DIAG] Running migrations...' && npx prisma db push --accept-data-loss && echo '[DIAG] Migrations done. Starting server...' && ls -la dist/bootstrap.js && echo '[DIAG] bootstrap.js found. Running...' && node dist/bootstrap.js"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
