services:
  - type: web
    name: trevolk-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: API_PREFIX
        value: /api/v1
      - key: APP_NAME
        value: trevolk-ai-workforce-backend
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: trevolk-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGIN
        value: https://trevolk-ai-workforce.vercel.app
      - key: REDIS_URL
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true

databases:
  - name: trevolk-db
    databaseName: trevolk
    user: trevolk_user
    plan: free
