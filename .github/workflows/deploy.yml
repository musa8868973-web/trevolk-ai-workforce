name: Trevolk Backend CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./dev.db"

      - name: TypeScript Typecheck
        working-directory: ./backend
        run: npm run typecheck

      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint

      - name: Run Test Suite
        working-directory: ./backend
        run: npm test
        env:
          JWT_SECRET: "test_jwt_secret_key_minimum_32_chars_long"
          JWT_REFRESH_SECRET: "test_refresh_jwt_secret_key_minimum_32_chars_long"

      - name: Build Backend
        working-directory: ./backend
        run: npm run build

  docker-build:
    name: Docker Image Build Check
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: trevolk-backend:latest
